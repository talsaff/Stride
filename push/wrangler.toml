name = "stride-push"
main = "src/index.js"
compatibility_date = "2025-01-01"
workers_dev = true

[vars]
# Sites allowed to talk to this service (comma-separated origins).
ALLOWED_ORIGINS = "https://talsaff.github.io"
# Contact URL sent to push services with every notification (VAPID "sub").
VAPID_SUBJECT = "https://github.com/talsaff/Stride"

[[durable_objects.bindings]]
name = "HUB"
class_name = "PushHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["PushHub"]
