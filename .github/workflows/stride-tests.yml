name: Stride engine tests

on:
  push:
    paths: ['docs/**', 'push/**']
  pull_request:
    paths: ['docs/**', 'push/**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
        working-directory: docs
      - run: npm test
        working-directory: push
